name: Build Android APK

# 앱을 정적 빌드하고 Capacitor로 Android 프로젝트에 반영한 뒤 테스트용(debug) APK를 만든다.
# PR에서는 빌드가 깨지지 않았는지 확인하고, 결과 APK는 실행 기록 페이지의 Artifacts에서 내려받는다. Play 스토어용 release 빌드는 서명 키가 필요해 여기서 만들지 않는다.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "posttech-times-app/**"
      - ".github/workflows/build-android-apk.yml"
  push:
    branches: [main]
    paths:
      - "posttech-times-app/**"
      - ".github/workflows/build-android-apk.yml"

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posttech-times-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: posttech-times-app/package-lock.json

      # Capacitor 8과 Android Gradle Plugin 8.13은 JDK 21을 쓴다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: posttech-times-app/android
        run: bash ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: posttech-times-debug-apk
          path: posttech-times-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
