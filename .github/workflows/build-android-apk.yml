name: Build Android APK

# 앱을 정적 빌드하고 Capacitor로 Android 프로젝트에 반영한 뒤, 저장소 Secret의 고정 키로 서명한 release APK를 만든다.
# 빌드마다 같은 키로 서명하므로 새 APK가 기존 설치 위에 업데이트된다.
# PR에서는 빌드가 깨지지 않았는지 확인하고, 결과 APK는 실행 기록 페이지의 Artifacts에서 내려받는다. Play 스토어용 release 빌드는 서명 키가 필요해 여기서 만들지 않는다.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release로 올릴 태그 이름(예: v7.0). 비우면 빌드만 합니다."
        required: false
        default: ""
  pull_request:
    paths:
      - "posttech-times-app/**"
      - ".github/workflows/build-android-apk.yml"
  push:
    branches: [main]
    paths:
      - "posttech-times-app/**"
      - ".github/workflows/build-android-apk.yml"

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posttech-times-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: posttech-times-app/package-lock.json

      # Capacitor 8과 Android Gradle Plugin 8.13은 JDK 21을 쓴다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::저장소 Secret ANDROID_KEYSTORE_BASE64가 없습니다."; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        working-directory: posttech-times-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon

      # 서명 인증서 지문을 로그에 남긴다. 릴리스마다 같아야 기존 설치 위에 업데이트된다.
      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: posttech-times-apk
          path: posttech-times-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          apk="posttech-times-$TAG.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TAG" "$apk" --title "포항공대신문 앱 $TAG" --target "$GITHUB_SHA" --generate-notes \
            --notes "고정된 키로 서명한 APK입니다. Play 스토어 밖에서 설치하므로 처음 설치할 때 '출처를 알 수 없는 앱' 허용이 필요합니다."
